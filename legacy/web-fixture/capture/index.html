<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PAS capture fixture</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="scene"></canvas>
<script>
// Counter and colors are diagnostic truth for offline analysis only.
const canvas = document.getElementById('scene');
const context = canvas.getContext('2d', {alpha: false});
let counter = 0;
let previous = 0;
function draw(timestamp) {
  // A visible update per animation callback; actual rate must be measured.
  if (timestamp !== previous) {
    previous = timestamp;
    const width = innerWidth;
    const height = innerHeight;
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    context.fillStyle = '#101010'; context.fillRect(0, 0, width, height);
    context.fillStyle = '#ff0000'; context.fillRect(0, 0, 50, 50);
    context.fillStyle = '#00ff00'; context.fillRect(width - 50, 0, 50, 50);
    context.fillStyle = '#0000ff'; context.fillRect(0, height - 50, 50, 50);
    context.fillStyle = '#ffffff'; context.fillRect(width - 50, height - 50, 50, 50);
    context.fillStyle = '#ffffff'; context.font = 'bold 48px monospace';
    context.fillText('PAS ' + counter.toString().padStart(8, '0'), 70, 65);
    // Two short rows fit portrait screens. Markers permit offline decoding.
    for (let row = 0; row < 2; row++) {
      const y = 90 + row * 26;
      context.fillStyle = '#ff0000'; context.fillRect(10, y, 12, 12);
      for (let bit = 0; bit < 12; bit++) {
        context.fillStyle = (counter & (1 << (row * 12 + bit))) ? '#ffffff' : '#000000';
        context.fillRect(30 + bit * 14, y, 12, 12);
      }
      context.fillStyle = '#ff0000'; context.fillRect(200, y, 12, 12);
    }
    context.fillStyle = '#ffcc00';
    const travel = Math.max(1, width - 80);
    context.fillRect(40 + (counter * 7) % travel, height / 2 - 25, 40, 50);
    counter++;
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</html>
